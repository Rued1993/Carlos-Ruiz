<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Web</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas#game { display: block; width: 100%; height: 100%; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.85); mix-blend-mode: difference; }
    #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
    #crosshair::after { left: 0; top: 9px; width: 20px; height: 2px; }
    #hotbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,.45); border-radius: 4px; }
    .slot { width: 48px; height: 48px; border: 3px solid #555; background-color: #333; image-rendering: pixelated; position: relative; box-sizing: border-box; }
    .slot.active { border-color: #fff; }
    .slot span { position: absolute; left: 2px; top: 0; font-size: 11px; color: #fff; text-shadow: 1px 1px #000; }
    #info { position: fixed; left: 8px; top: 8px; color: #fff; font: 12px monospace; text-shadow: 1px 1px #000; white-space: pre; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; text-align: center; }
    #overlay h1 { margin: 0; font-size: 44px; letter-spacing: 2px; }
    #overlay p { margin: 2px; color: #ccc; }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="hotbar"></div>
  <div id="info"></div>
  <div id="overlay">
    <h1>MINECRAFT WEB</h1>
    <p id="status">Generando mundo…</p>
    <p><b>Clic</b> para jugar</p>
    <p>WASD mover · Espacio saltar · Shift correr · F volar (Espacio/Q subir/bajar)</p>
    <p>Clic izq. romper · Clic der. colocar · 1-8 o rueda: elegir bloque · Esc pausa</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
