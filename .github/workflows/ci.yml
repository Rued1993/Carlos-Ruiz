name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npx prettier --check "src/js/**/*.js" "tests/**/*.js" "tools/**/*.js"
      - name: Build y pruebas de humo
        run: npm test
